name: Canon L1-L6
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify six laws and local references
        run: python scripts/check_canon.py
