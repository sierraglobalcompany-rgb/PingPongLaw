name: Canon L1-L6
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified actions/checkout v4
        with:
          persist-credentials: false
      - name: Verify canon and links
        run: python3 scripts/check_canon.py
      - name: Verify negative regression fixtures
        run: python3 -m unittest discover -s tests -v
