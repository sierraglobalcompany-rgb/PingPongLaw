name: Canon L1-L6
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified actions/checkout v6 (Node 24)
        with:
          persist-credentials: false
      - name: Verify canon and links
        run: python3 scripts/check_canon.py
      - name: Verify negative regression fixtures
        run: python3 -m unittest discover -s tests -v
